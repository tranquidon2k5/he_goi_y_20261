[project]
name = "cinerec-backend"
version = "0.1.0"
description = "CineRec API — hệ gợi ý phim (IT4613)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    # dịch vụ gợi ý + huấn luyện (PRD mục 5); bản CUDA 12.8 chạy được trên GPU Turing trở lên và cả CPU
    "torch>=2.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = ["pytest>=8.3"]
ml = [
    "optuna>=5.1.0",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
